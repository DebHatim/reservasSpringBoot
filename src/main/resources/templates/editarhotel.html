<html th:replace="~{global :: plantilla(~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<main>
	<a class="m-3 mb-4 h4 text-decoration-none text-primary"
		th:href="@{/admin/hoteles}"><-- Volver al listado de hoteles</a>
	<h1 class="m-3 mb-4">
		Editar hotel <span th:text="${hotel.nombre}"></span>
	</h1>
	<form th:action="@{/admin/hoteles/editar/{id}(id=${hotel.id})}"
		th:object="${hotel}" method="post" class="m-3">

		<div class="form-group">
			<label class="my-2">Nombre del hotel</label>
			<input type="text" class="form-control" th:field="*{nombre}" required>
		</div>
		<div class="form-group">
			<label class="my-2">Dirección del hotel</label>
			<input type="text" class="form-control" th:field="*{direccion}" required>
		</div>
		<div class="form-group">
			<label class="my-2">Imagen principal del hotel(url)</label>
			<input type="text" class="form-control" th:field="*{url}" required>
		</div>
		<div th:if="${msg}" class="form-group">
			<p th:text="${msg}" class="mt-2 mb-0 text-success"></p>
		</div>
		<div th:if="${error}" class="form-group">
			<p th:text="${error}" class="mt-2 mb-0 text-danger"></p>
		</div>
		<button type="submit" class="btn btn-primary mt-3">Guardar
			cambios</button>
	</form>
</main>
