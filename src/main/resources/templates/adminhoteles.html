<html th:replace="~{global :: plantilla(~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<main>
	<a class="m-3 mb-4 h4 text-decoration-none text-primary" th:href="@{/admin}"><-- Volver</a>
	<h1 class="m-3">Gestionar hoteles</h1>
	<table class="table m-3">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Nombre</th>
				<th scope="col">Direccion</th>
				<th scope="col">Foto en miniatura</th>
				<th scope="col">Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="hotel : ${hoteles}">
				<th scope="row" th:text="${hotel.id}"></th>
				<td th:text="${hotel.nombre}"></td>
				<td th:text="${hotel.direccion}"></td>
				<td><img class="fotomin" th:src="${hotel.fotos[0]}" /></td>
				<td>
					<a th:href="@{/admin/hoteles/editar/{id}(id=${hotel.id})}" class="btn btn-primary">Editar</a>
					<form method="POST" th:action="@{/admin/hoteles/eliminar/{id}(id=${hotel.id})}" class="d-inline">
						<button type="submit" class="btn btn-danger">Eliminar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	<a th:href="@{/admin/hoteles/crear}" class="btn btn-primary">Registrar hotel</a>
</main>
